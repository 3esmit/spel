name: Publish Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/v')
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from branch
        id: version
        run: |
          VERSION=${GITHUB_HEAD_REF#release/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ## v${{ steps.version.outputs.version }}

            See [CHANGELOG.md](${{ github.server_url }}/${{ github.repository }}/blob/main/CHANGELOG.md) for full details.

            ---

            **Installation** (Cargo.toml):
            ```toml
            spel-framework = { git = "${{ github.server_url }}/${{ github.repository }}.git", tag = "v${{ steps.version.outputs.version }}" }
            ```
          draft: false
          prerelease: false

  release-binaries:
    name: Publish native CLI bundles
    needs: publish-release
    permissions:
      contents: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: v${{ needs.publish-release.outputs.version }}
      prerelease: false
    secrets: inherit
